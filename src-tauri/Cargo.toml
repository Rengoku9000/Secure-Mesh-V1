[package]
name = "securemesh"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "securemesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ed25519-dalek = "3.0.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
getrandom = "0.4.3"
zeroize = "1.9.0"
hex = "0.4.3"
sha2 = "0.11.0"
libp2p = { version = "0.56.0", features = ["ed25519", "quic", "mdns", "request-response", "json", "identify", "ping", "macros", "tokio", "cbor"] }
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }

# Device location on Windows, via the platform's own location service.
#
# Not a new supply chain: Tauri already pulls `windows` in on this target, so
# this enables the Geolocation namespace on a crate that is present either way.
# There is no official Tauri geolocation plugin for desktop — its platform table
# marks Linux, Windows and macOS unsupported, and its source has no desktop
# implementation — so the platform API is called directly.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Geolocation",
    "Foundation",
] }
# Provides the `Async` trait, whose `join()` blocks on a WinRT async
# operation. Already in the tree beneath `windows`, which does not re-export it.
windows-future = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v4"] }

